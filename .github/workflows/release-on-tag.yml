name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Tesseract (Chocolatey)
        shell: powershell
        run: |
          choco install -y tesseract

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Clean dist folder
        run: |
          if exist dist rmdir /s /q dist
      - name: Build CalculadoraCLI.exe
        run: pyinstaller --noconfirm --onefile --name CalculadoraCLI calculadora_cli.py
      - name: Build calculadora_cli.exe (compatibilidad)
        run: pyinstaller --noconfirm --onefile --name calculadora_cli calculadora_cli.py

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}
            
            Incluye los ejecutables Windows:
            - CalculadoraCLI.exe (principal)
            - calculadora_cli.exe (compatibilidad)
            
            Requiere tener Tesseract instalado para OCR.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CalculadoraCLI.exe to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/CalculadoraCLI.exe
          asset_name: CalculadoraCLI.exe
          asset_content_type: application/octet-stream

      - name: Upload calculadora_cli.exe to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/calculadora_cli.exe
          asset_name: calculadora_cli.exe
          asset_content_type: application/octet-stream
